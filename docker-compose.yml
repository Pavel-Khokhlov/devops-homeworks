services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.development.db
    ports:
      - 15432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$$POSTGRES_USER", "-d", "$$POSTGRES_NAME"]
      interval: 10s       # между запросами
      timeout: 5s         # ждем ответа
      retries: 5          # количество попыток
      start_period: 20s   # ждем разворачивания базы данных

  back:
    image: ${DOCKERHUB_USERNAME}/back:${APP_VERSION}
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION}
    env_file:
      - .env.development.back
    volumes:
      - ./app-config:/app/config:ro
    ports:
      - 13000:3000 
    depends_on:
      db:
        condition: service_healthy

  front:
    image: ${DOCKERHUB_USERNAME}/front:${APP_VERSION}
    restart: unless-stopped
    ports:
      - 18080:80
    depends_on:
      back:
        condition: service_started

volumes:
  pgdata:
