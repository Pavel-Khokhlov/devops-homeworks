name: Reusable Checks

on:
  workflow_call:
    inputs:
      check-type:
        description: 'Type of check to run'
        type: string
        default: 'all'
        required: false
    secrets:
      KUBECONFIG:
        required: false

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yml

  kubeval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate K8s manifests
        uses: stefanprodan/kube-tools@v1
        with:
          command: kubeval k8s/